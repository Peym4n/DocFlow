spring.application.name=backend

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/docflow
spring.datasource.username=docflow
spring.datasource.password=docflow

# Hibernate / JPA
# Coursework setting: mapped tables and their data are recreated at every application startup.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.paths-to-match=/api/v1/**
