spring.application.name=docflow-api
server.port=${SERVER_PORT:8080}

# PostgreSQL connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:docflow}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:docflow}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

# Hibernate / JPA
# Coursework setting: mapped tables and their data are recreated at every application startup.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.paths-to-match=/api/v1/**

# Readiness includes the database; liveness remains independent of external services.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.description=DocFlow metadata API scaffold
