spring.application.name=docflow-api
server.port=${SERVER_PORT:8080}

# PostgreSQL connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:docflow}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:docflow}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

# Hibernate / JPA
# Coursework setting: mapped tables and their data are recreated at every application startup.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.paths-to-match=/api/v1/**

# Readiness includes the database; liveness remains independent of external services.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,storage
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.description=DocFlow document API

docflow.upload.max-bytes=${UPLOAD_MAX_BYTES:10485760}
docflow.upload.max-pages=${UPLOAD_MAX_PAGES:100}
spring.servlet.multipart.max-file-size=${docflow.upload.max-bytes}B
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_BYTES:11534336}B
docflow.storage.endpoint=${MINIO_ENDPOINT:http://localhost:${MINIO_PORT:9000}}
docflow.storage.bucket=${MINIO_BUCKET:docflow}
docflow.storage.access-key=${MINIO_ROOT_USER:}
docflow.storage.secret-key=${MINIO_ROOT_PASSWORD:}
docflow.storage.timeout-millis=${MINIO_TIMEOUT_MILLIS:5000}
