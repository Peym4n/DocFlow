services:
  db:
    image: postgres:17
    container_name: docflow-db
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: docflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/docflow
      SPRING_DATASOURCE_USERNAME: docflow
      SPRING_DATASOURCE_PASSWORD: docflow
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: