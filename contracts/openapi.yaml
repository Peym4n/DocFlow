openapi: 3.1.0
info:
  title: DocFlow API
  description: "Owner-scoped PDF upload and metadata management. Errors use application/problem+json:\
    \ invalid input 400, missing identity 401, missing document 404, conflict 409,\
    \ excessive upload 413 and unavailable dependencies 503."
  version: v1
servers:
- url: /
tags:
- name: Documents
  description: Owner-scoped document metadata and PDF storage
paths:
  /api/v1/documents/{id}/metadata:
    put:
      tags:
      - Documents
      summary: Replace editable metadata
      description: "Owner, ID, creation time and original storage key are preserved."
      operationId: updateDocument
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentMetadataRequest"
        required: true
      responses:
        "200":
          description: Updated metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Invalid metadata
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Document not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/documents:
    get:
      tags:
      - Documents
      summary: List document metadata
      description: Unpaginated list belonging to the current owner.
      operationId: getAllDocuments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"
    post:
      tags:
      - Documents
      summary: Upload a PDF
      description: "Multipart fields: file, optional title and description. Processing\
        \ is deferred, not queued."
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentRequest"
      responses:
        "202":
          description: PDF stored; processing deferred
          headers:
            Location:
              description: Processing status resource
              style: simple
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResponse"
        "400":
          description: Invalid PDF or metadata
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "413":
          description: Upload exceeds configured limits
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/documents/{id}:
    get:
      tags:
      - Documents
      summary: Get document metadata
      operationId: getDocumentById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          description: Document not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - Documents
      summary: Delete a document
      description: "Commits metadata deletion, then attempts object cleanup."
      operationId: deleteDocument
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Document deleted
        "404":
          description: Document not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/documents/{id}/processing:
    get:
      tags:
      - Documents
      summary: Get processing status
      description: PDF processing is deferred until the worker stages are implemented.
      operationId: processing
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Processing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentProcessingResponse"
        "404":
          description: Document not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/documents/{id}/content:
    get:
      tags:
      - Documents
      summary: Download the original PDF
      operationId: content
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Original PDF attachment
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Document or content not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    DocumentMetadataRequest:
      type: object
      additionalProperties: false
      description: Complete editable metadata. Required fields must be supplied; null
        description clears it.
      properties:
        filename:
          type: string
          maxLength: 255
          minLength: 0
        contentType:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type:
          - string
          - "null"
          maxLength: 255
          minLength: 0
        title:
          type: string
          description: Document title; defaults to filename when omitted
          maxLength: 255
          minLength: 0
      required:
      - contentType
      - filename
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: object
          additionalProperties:
            type: string
          description: Field validation messages; present only for validation failures
    DocumentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        filename:
          type: string
        contentType:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        title:
          type: string
    DocumentRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        title:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - file
    DocumentUploadResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
        statusUrl:
          type: string
    DocumentProcessingResponse:
      type: object
      properties:
        documentId:
          type: integer
          format: int64
        status:
          type: string
        detail:
          type: string
